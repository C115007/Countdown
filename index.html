<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
    <title>Countdown</title>
</head>

<body>
    <div id="countdown" class="countdown">
        <ul>
            <li><span id="days">00</span>days</li>
            <li class="separator">:</li>
            <li><span id="hours">00</span>hours</li>
            <li class="separator">:</li>
            <li><span id="minutes">00</span>minutes</li>
            <li class="separator">:</li>
            <li><span id="seconds">00</span>seconds</li>
        </ul>
    </div>
    <div class="social_links">
        <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
        <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
        <a href="#"><ion-icon name="logo-youtube"></ion-icon></a>
        <a href="#"><ion-icon name="logo-discord"></ion-icon></a>
        <a href="#"><ion-icon name="logo-github"></ion-icon></a>
    </div>
    <script disable-devtool-auto src='https://cdn.jsdelivr.net/npm/disable-devtool' disable-menu='false'></script>
</body>

</html>
